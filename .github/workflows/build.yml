name: Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRIVATE_CERTIFICATE_BASE64: ${{ secrets.PRIVATE_CERTIFICATE_BASE64 }}
      PRIVATE_CERTIFICATE_PASSWORD: ${{ secrets.PRIVATE_CERTIFICATE_PASSWORD }}
      PRIVATE_CERTIFICATE_FINGERPRINT: ${{ secrets.PRIVATE_CERTIFICATE_FINGERPRINT }}

    steps: 
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify
        shell: pwsh
        run: |
          $Message = "${{ github.event.head_commit.message }}"
          
          if ($Message -notlike 'release:*') 
          { 
              Write-Host "Not a release commit, cancelling."
              gh run cancel "${{ github.run_id }}"
              gh run watch "${{ github.run_id }}"
              exit 0 
          }

          Write-Host "A release commit, proceeding."

      - name: .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
        
      - name: Bump
        shell: pwsh
        run: |
          Write-Host "Bumping package version with build date."

          $Path = "$(Get-Location)\src\Flarial.Launcher\Package.appxmanifest"

          $Date = Get-Date -AsUTC -Format "yyMM.ddHH.mmss.0"
          $Version = [version]::new($Date).ToString()

          [xml]$Manifest = Get-Content "$Path"
          $Manifest.Package.Identity.Version = "$Version"
          $Manifest.Save("$Path")

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@example.com"

          git add "$Path"
          git commit -m "Version -> '$Version'"
          git push

      - name: Build
        shell: pwsh
        run: |
          $Path = "$(Get-Location)\src\Flarial.Launcher\Flarial.Launcher.csproj"
          dotnet publish "$ProjectPath"

      - name: Sign
        shell: pwsh
        run: |
          $Path = "$(Get-Location)\Certificate.pfx"
          $Bytes = [System.Convert]::FromBase64String($ENV:PRIVATE_CERTIFICATE_BASE64)
          [System.IO.File]::WriteAllBytes($Path, $Bytes)

          dotnet tool install --tool-path . --prerelease sign
          ./sign.exe code certificate-store -cf "$Path" -p "$ENV:PRIVATE_CERTIFICATE_PASSWORD" -cfp "$ENV:PRIVATE_CERTIFICATE_FINGERPRINT" "AppPackages\Flarial.Launcher_Test\Flarial.Launcher.msix" -o "AppPackages\Flarial.Launcher.msix"
